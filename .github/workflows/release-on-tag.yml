name: Release On Tag

on:
  push:
    tags:
      - "v*"
  # Cut Release uses GITHUB_TOKEN, whose tag push cannot trigger this workflow.
  # Dispatch at the tag (not main) to preserve the provenance source ref.
  workflow_dispatch:

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify exact tagged source
        run: |
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          bash scripts/verify-cli-release-source.sh "$RELEASE_TAG" "$RELEASE_COMMIT"
      - name: Refuse existing release records before building
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-cli-release-assets.py "$RELEASE_TAG"
      - name: Test installer CLI
        run: make cli-test
      - name: Build installer release binaries and checksums
        run: make release-cli-artifacts VERSION="$RELEASE_TAG"
      - name: Attest release binaries
        id: attest
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Include provenance bundle in release assets
        env:
          PROVENANCE_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$PROVENANCE_BUNDLE" "dist/skills-hub_${RELEASE_TAG}_provenance.json"
      - name: Recheck release records immediately before draft creation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-cli-release-assets.py "$RELEASE_TAG"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-cli-release.py "$RELEASE_TAG" "$RELEASE_COMMIT" dist
