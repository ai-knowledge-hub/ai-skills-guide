id: engineering/coverage-gap-reporter
name: Coverage Gap Reporter
description: Parse coverage outputs, map changed files to uncovered risk
  areas, and recommend targeted tests.
version: 0.1.0
released_at: "2026-03-19T00:00:00Z"
category: engineering/testing-quality
tags:
  - coverage
  - tests
  - reporting
  - quality
license: MIT
author:
  name: AI Skills Guide Maintainers
  url: https://github.com/ai-knowledge-hub/ai-skills-guide
repository: https://github.com/ai-knowledge-hub/ai-skills-guide
runtimes:
  - codex
  - claude
  - generic
entrypoints:
  skill_md: SKILL.md
  readme: README.md
  tests: tests/test-prompts.md
  scripts_dir: scripts
  examples_dir: examples
operational:
  use_when: Use when coverage artifacts need to be mapped to changed files and uncovered regression risk.
  execution_mode: analysis-only
  outputs:
    - Coverage gap report
    - Risk-ranked files
    - Suggested tests
  approval_boundary: Safe for coverage analysis and recommendation; require human approval before modifying CI coverage gates.
verification:
  tests_min_prompts: 5
  deterministic_scripts: false
  security_reviewed: false
deprecated: false
