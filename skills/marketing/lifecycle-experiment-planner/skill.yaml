schema_version: "1.1"
id: marketing/lifecycle-experiment-planner
name: Lifecycle Experiment Planner
description: Design lifecycle A/B tests with hypothesis checks,
  sample-size guidance, and stopping criteria.
version: 0.1.0
released_at: "2026-02-23T00:00:00Z"
category: marketing-tools/lifecycle-crm
tags:
  - experimentation
  - ab-testing
  - lifecycle
  - statistics
license: MIT
author:
  name: AI Skills Guide Maintainers
  url: https://github.com/ai-knowledge-hub/ai-skills-guide
repository: https://github.com/ai-knowledge-hub/ai-skills-guide
runtimes:
  - codex
  - claude
  - generic
entrypoints:
  skill_md: SKILL.md
  readme: README.md
  tests: tests/test-prompts.md
  scripts_dir: scripts
  examples_dir: examples
dependencies:
  tools:
    - python3
operational:
  use_when: Use when a lifecycle experiment needs statistical assumptions, stop rules, and guardrail metrics defined clearly.
  execution_mode: may-run-local-verification
  outputs:
    - Hypothesis plan
    - Sample-size guidance
    - Stop criteria
  approval_boundary: Safe for planning; require human approval before launching lifecycle experiments or changing user journeys.
usability:
  availability: documentation-only
  execution: instructions
  limitations:
    - Instruction package only; it does not provide or authorize an executable runtime capability.
  quickstart: Read SKILL.md and follow the documented workflow.
  executable_helpers:
    - entrypoint: scripts/sample_size.py
      availability: not-verified
      execution: local-tool
      limitations:
        - Packaged helper exists, but current clean-client executable evidence is not recorded.
      quickstart: python3 scripts/sample_size.py 0.05 0.01
verification:
  tests_min_prompts: 5
  deterministic_scripts: true
  security_reviewed: false
deprecated: false
