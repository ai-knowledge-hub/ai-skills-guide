name: Published registry installation

on:
  workflow_dispatch:
    inputs:
      sample:
        description: Exact published package to verify
        required: true
        type: choice
        default: instructions
        options: [instructions, ga4, bigquery, meta-ads, code-maintenance]
      client_source:
        description: Released client or explicitly labelled candidate build
        required: true
        type: choice
        default: release
        options: [release, candidate]
      cli_release:
        description: Exact CLI tag for release mode (must have binaries, checksums and provenance)
        type: string
        required: false
      registry_url:
        description: Public HTTPS registry (blank selects the sample's module index)
        type: string
        required: false

permissions:
  contents: read
  attestations: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        if: inputs.sample != 'instructions'
        with:
          node-version: 22
      - name: Build read-only manifest and receipt verifier
        env:
          CGO_ENABLED: '0'
        run: go build -o bin/published-install-verifier ./cmd/published-install-verifier
      - name: Build explicit installer candidate (same profile as release)
        if: inputs.client_source == 'candidate'
        env:
          CGO_ENABLED: '0'
        run: make cli-build-test
      - name: Check published installation from a source-free temporary directory
        env:
          CLIENT_SOURCE: ${{ inputs.client_source }}
          CLI_RELEASE: ${{ inputs.cli_release }}
          REGISTRY_URL: ${{ inputs.registry_url }}
          SAMPLE: ${{ inputs.sample }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$CLIENT_SOURCE" == "release" ]]; then
            python3 scripts/check-published-install.py \
              --sample "${SAMPLE:-instructions}" \
              --cli-release "$CLI_RELEASE" --registry-url "$REGISTRY_URL" \
              --report output/published-install/report.json
          else
            python3 scripts/check-published-install.py \
              --sample "${SAMPLE:-instructions}" \
              --cli bin/skills-hub-test --registry-url "$REGISTRY_URL" \
              --report output/published-install/report.json
          fi
      - name: Retain bounded success or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-install-${{ matrix.os }}-${{ inputs.client_source }}${{ inputs.sample && inputs.sample != 'instructions' && format('-{0}', inputs.sample) || '' }}
          path: output/published-install/report.json
          if-no-files-found: warn

  windows-instructions:
    # Published Windows binary execution is deliberately limited to this
    # instruction-only sample. MCP/plugin process checks remain Linux/macOS.
    if: inputs.sample == 'instructions' && inputs.client_source == 'release'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build read-only Windows manifest and receipt verifier
        env:
          CGO_ENABLED: '0'
        run: go build -o bin/published-install-verifier.exe ./cmd/published-install-verifier
      - name: Check published Windows installation outside the checkout
        env:
          CLI_RELEASE: ${{ inputs.cli_release }}
          REGISTRY_URL: ${{ inputs.registry_url }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/check-published-install.py
          --sample instructions --cli-release "$env:CLI_RELEASE"
          --registry-url "$env:REGISTRY_URL"
          --verifier bin/published-install-verifier.exe
          --report output/published-install/report.json
      - name: Retain bounded Windows success or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-install-windows-latest-release
          path: output/published-install/report.json
          if-no-files-found: warn
