version: 0.1.0
released_at: "2026-04-26T00:00:00Z"
category: security/runtime-hardening
tags:
  - marketing
  - adtech
  - security
  - approvals
  - data-governance
license: MIT
author:
  name: AI Skills Guide Maintainers
  url: https://github.com/ai-knowledge-hub/ai-skills-guide
