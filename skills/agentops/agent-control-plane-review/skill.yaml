id: agentops/agent-control-plane-review
name: Agent Control Plane Review
description: Review an agent workflow for identity, gateway, policy, approval, inspection, and audit coverage before it touches production systems.
version: 0.1.0
released_at: "2026-04-26T00:00:00Z"
category: agentops/harness-governance
tags:
  - agent-control
  - governance
  - identity
  - audit
  - gateway
license: MIT
author:
  name: AI Skills Guide Maintainers
  url: https://github.com/ai-knowledge-hub/ai-skills-guide
repository: https://github.com/ai-knowledge-hub/ai-skills-guide
runtimes:
  - codex
  - claude
  - generic
entrypoints:
  skill_md: SKILL.md
  readme: README.md
  tests: tests/test-prompts.md
  examples_dir: examples
operational:
  use_when: Use before deploying or expanding an agent workflow that can call tools, access data, or trigger operational actions.
  execution_mode: analysis-only
  outputs:
    - Control-plane readiness report
    - Missing guardrail list
    - Approval boundary recommendations
  approval_boundary: Analysis-only; must not grant permissions, create credentials, or enable production tool access.
verification:
  tests_min_prompts: 5
  deterministic_scripts: false
  security_reviewed: false
deprecated: false
