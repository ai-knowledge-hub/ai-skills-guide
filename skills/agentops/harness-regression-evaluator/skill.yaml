id: agentops/harness-regression-evaluator
name: Harness Regression Evaluator
description: Evaluate proposed harness changes against benchmark prompts and
  red-team scenarios before adoption.
version: 0.1.0
released_at: "2026-03-19T00:00:00Z"
category: agentops/harness-evaluation
tags:
  - evaluation
  - benchmarks
  - harness
  - regression
license: MIT
author:
  name: AI Skills Guide Maintainers
  url: https://github.com/ai-knowledge-hub/ai-skills-guide
repository: https://github.com/ai-knowledge-hub/ai-skills-guide
runtimes:
  - codex
  - claude
  - generic
entrypoints:
  skill_md: SKILL.md
  readme: README.md
  tests: tests/test-prompts.md
  scripts_dir: scripts
  examples_dir: examples
operational:
  use_when: Use when proposed harness changes need benchmark and red-team evaluation before adoption.
  execution_mode: may-run-local-verification
  outputs:
    - Evaluation summary
    - Regression findings
    - Adopt or reject recommendation
  approval_boundary: Safe for harness evaluation; require human approval before applying accepted harness changes.
verification:
  tests_min_prompts: 5
  deterministic_scripts: false
  security_reviewed: false
deprecated: false
