id: engineering/test-gap-analyzer
name: Test Gap Analyzer
description: Identify missing unit, integration, regression, and edge-case
  test scenarios for recently changed code.
version: 0.1.0
released_at: "2026-03-19T00:00:00Z"
category: engineering/testing-quality
tags:
  - tests
  - gaps
  - regression
  - quality
license: MIT
author:
  name: AI Skills Guide Maintainers
  url: https://github.com/ai-knowledge-hub/ai-skills-guide
repository: https://github.com/ai-knowledge-hub/ai-skills-guide
runtimes:
  - codex
  - claude
  - generic
entrypoints:
  skill_md: SKILL.md
  readme: README.md
  tests: tests/test-prompts.md
  scripts_dir: scripts
  examples_dir: examples
operational:
  use_when: Use when changed code needs missing unit, integration, regression, and edge-case scenarios identified.
  execution_mode: read-only-local-inspection
  outputs:
    - Missing test scenarios
    - Risk ranking
    - Suggested next tests
  approval_boundary: Safe for inspection and recommendation; require human approval before broadening test scope or changing suites.
verification:
  tests_min_prompts: 5
  deterministic_scripts: false
  security_reviewed: false
deprecated: false
