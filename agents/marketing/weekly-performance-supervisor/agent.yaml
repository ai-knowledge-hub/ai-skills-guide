schema_version: "1.1"
id: marketing/weekly-performance-supervisor
name: Weekly Performance Supervisor
description: Orchestrate weekly performance reporting by chaining dashboard generation, QA checks, and executive narrative output.
version: 0.2.0
released_at: "2026-09-26T00:00:00Z"
category: marketing-agents/performance
tags:
  - weekly-reporting
  - orchestration
  - qa-gating
license: MIT
author:
  name: AI Skills Guide Maintainers
  url: https://github.com/ai-knowledge-hub/ai-skills-guide
repository: https://github.com/ai-knowledge-hub/ai-skills-guide
runtimes:
  - codex
  - claude
  - generic
entrypoints:
  spec: AGENT.md
  readme: README.md
  tests: tests/test-prompts.md
  examples_dir: examples
dependencies:
  skills:
    - adtech/dashboard-generator
    - adtech/dashboard-qa-checker
    - adtech/executive-narrative-writer
  tools:
    - analytics/ga4-mcp-connector
    - warehouse/bigquery-mcp-query-runner
orchestration:
  model:
    selection: runtime-selected
    required_capabilities: [tool-use, structured-output]
  memory:
    mode: bundled
    path: config/memory-profile.example.json
    required: true
  governance:
    mode: bundled
    path: config/governance.example.json
    required: true
  bindings:
    - {name: dashboard_generation, kind: skill, package: adtech/dashboard-generator, version: 0.1.0, requirement: required, availability: resolved}
    - {name: dashboard_qa, kind: skill, package: adtech/dashboard-qa-checker, version: 0.1.0, requirement: required, availability: resolved}
    - {name: executive_narrative, kind: skill, package: adtech/executive-narrative-writer, version: 0.1.0, requirement: required, availability: resolved}
    - {name: ga4_query, kind: tool, package: analytics/ga4-mcp-connector, version: 0.2.0, requirement: required, access: read-only, availability: resolved}
    - {name: warehouse_query, kind: tool, package: warehouse/bigquery-mcp-query-runner, version: 0.2.0, requirement: required, access: read-only, availability: resolved}
operational:
  role: Weekly reporting supervisor for QA-gated performance review workflows.
  coordinates:
    - Dashboard generation
    - QA gating and blocking decisions
    - Executive narrative drafting after approval
  autonomy_level: semi-autonomous
  approval_boundary: May coordinate reporting workflows and draft narratives after QA approval; require human approval before any external publish or stakeholder send.
  outputs:
    - Publish decision
    - Dashboard package
    - QA package
    - Executive narrative
usability:
  availability: setup-required
  execution: orchestrator
  limitations:
    - GA4 and BigQuery credentials and provider targets must be configured before reporting.
  quickstart: Install the agent, then configure each provider named by the generated runtime contract.
verification:
  tests_min_prompts: 5
  security_reviewed: false
deprecated: false
