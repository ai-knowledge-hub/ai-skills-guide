schema_version: "1.1"
id: marketing/campaign-qa-supervisor
name: Campaign QA Supervisor
description: Validate campaign setup quality, tracking integrity, and policy compliance before launch or major edits.
version: 0.2.0
released_at: "2026-09-26T00:00:00Z"
category: marketing-agents/governance
tags:
  - campaign-qa
  - policy
  - governance
license: MIT
author:
  name: AI Skills Guide Maintainers
  url: https://github.com/ai-knowledge-hub/ai-skills-guide
repository: https://github.com/ai-knowledge-hub/ai-skills-guide
runtimes:
  - codex
  - claude
  - generic
entrypoints:
  spec: AGENT.md
  readme: README.md
  tests: tests/test-prompts.md
  examples_dir: examples
dependencies:
  skills:
    - adtech/policy-brand-compliance-checker
orchestration:
  model:
    selection: runtime-selected
    required_capabilities: [tool-use, structured-output]
  memory:
    mode: bundled
    path: config/memory-profile.example.json
    required: true
  governance:
    mode: bundled
    path: config/governance.example.json
    required: true
  bindings:
    - {name: policy_compliance, kind: skill, package: adtech/policy-brand-compliance-checker, version: 0.1.0, requirement: required, availability: resolved}
    - name: campaign_config_reader
      kind: tool
      requirement: required
      access: read-only
      availability: unavailable
      reason: No cataloged campaign configuration provider currently implements this capability.
    - name: slack_post
      kind: tool
      requirement: optional
      access: read-write
      availability: unavailable
      reason: No cataloged Slack provider is available; return an alert draft for human delivery.
operational:
  role: Governance agent for campaign QA, tracking integrity, and launch readiness.
  coordinates:
    - Campaign payload validation
    - Policy and naming checks
    - Severity assessment and remediation routing
  autonomy_level: execution-capable-with-approval
  approval_boundary: May assess launch readiness and draft remediation alerts; require human approval before overriding critical failures or taking live launch actions.
  outputs:
    - Pass, warn, or fail decision
    - Critical blocker list
    - Remediation action list
    - Alert summary for escalation
usability:
  availability: not-verified
  execution: orchestrator
  limitations:
    - A cataloged campaign configuration reader is not yet available; alert delivery remains a human-owned draft.
  quickstart: Install for policy review only; the compiled contract blocks connected QA until a campaign reader is published.
verification:
  tests_min_prompts: 5
  security_reviewed: false
deprecated: false
