id: security/secrets-and-credential-hygiene
name: Secrets and Credential Hygiene
description: Scan diffs and repository context for leaked secrets, risky
  credential placement, and over-broad environment exposure.
version: 0.1.0
released_at: "2026-03-19T00:00:00Z"
category: security/runtime-hardening
tags:
  - secrets
  - credentials
  - hygiene
  - audit
license: MIT
author:
  name: AI Skills Guide Maintainers
  url: https://github.com/ai-knowledge-hub/ai-skills-guide
repository: https://github.com/ai-knowledge-hub/ai-skills-guide
runtimes:
  - codex
  - claude
  - generic
entrypoints:
  skill_md: SKILL.md
  readme: README.md
  tests: tests/test-prompts.md
  scripts_dir: scripts
  examples_dir: examples
dependencies:
  tools:
    - gitleaks
operational:
  use_when: Use when diffs or repository context need secret scanning and credential exposure review.
  execution_mode: may-run-local-verification
  outputs:
    - Secret findings
    - Severity matrix
    - Remediation steps
  approval_boundary: May run local secret scanners and redact findings; require human approval before revocation or rotation actions.
verification:
  tests_min_prompts: 5
  deterministic_scripts: false
  security_reviewed: false
deprecated: false
