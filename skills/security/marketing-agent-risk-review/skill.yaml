  - claude
  - generic
entrypoints:
  skill_md: SKILL.md
  readme: README.md
  tests: tests/test-prompts.md
  examples_dir: examples
operational:
  use_when: Use when reviewing marketing or adtech agents that touch spend, audiences, product data, analytics, customer data, or publishing workflows.
