name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill structure
        run: bash scripts/validate-skills.sh

  script-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test CLI release source and dispatch boundaries
        run: python3 -m unittest discover -s scripts/tests -p 'test_cli_release.py'
      - name: Run deterministic skill script checks
        run: bash scripts/test-skill-scripts.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test published-install evidence checks with local fixtures
        run: python3 -m unittest discover -s scripts/tests -p 'test_published_install.py'
      - name: Test Windows delivery boundaries with local fixtures
        run: python3 -m unittest discover -s scripts/tests -p 'test_published_windows.py'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Follow retained-package installer setup guidance without provider access
        run: python3 -m unittest discover -s scripts/tests -p 'test_installer_setup.py'
      - name: Test published GA4 installation and credential-free startup evidence
        run: python3 -m unittest discover -s scripts/tests -p 'test_published_ga4.py'
      - name: Test published BigQuery and Meta Ads installation and MCP startup evidence
        run: python3 -m unittest discover -s scripts/tests -p 'test_published_tools.py'
      - name: Test published plugin closure, registration and first-use evidence
        run: python3 -m unittest discover -s scripts/tests -p 'test_published_plugin.py'

  windows-install-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Windows executable, environment, receipt and junction boundaries natively
        run: python -m unittest discover -s scripts/tests -p 'test_published_windows.py'

  manifest-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install check-jsonschema
        run: python3 -m pip install --upgrade pip "check-jsonschema==0.37.0"
      - name: Test structural contracts and runtime freshness enforcement
        run: make cli-test
      - name: Test preserved readiness development profile
        run: make cli-runtime-test
      - name: Build installer candidate without model keys
        run: make cli-build-test
      - name: Generate canonical registry indexes
        run: make registry
      - name: Validate manifests and registry schemas
        run: bash scripts/validate-manifests.sh
      - name: Ensure registry indexes are committed
        run: git diff --exit-code registry/index.json registry/skills-index.json registry/agents-index.json registry/tools-index.json registry/plugins-index.json

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v20

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true

  web-e2e-smoke:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run smoke e2e
        run: npx playwright test

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint web app
        run: pnpm lint
      - name: Build web app
        run: pnpm build
      - name: Reject mutation or deletion of published releases
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          cd ../..
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi
          bash scripts/check-release-history.sh "$base_sha" "$CURRENT_SHA"
      - name: Ensure immutable releases are committed
        run: cd ../.. && make release-assets-check
