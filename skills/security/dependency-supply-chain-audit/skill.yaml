id: security/dependency-supply-chain-audit
name: Dependency Supply Chain Audit
description: Review manifests and lockfiles for vulnerable, suspicious, or
  overpowered dependencies and recommend mitigations.
version: 0.1.0
released_at: "2026-03-19T00:00:00Z"
category: security/supply-chain
tags:
  - dependencies
  - sca
  - cve
  - supply-chain
license: MIT
author:
  name: AI Skills Guide Maintainers
  url: https://github.com/ai-knowledge-hub/ai-skills-guide
repository: https://github.com/ai-knowledge-hub/ai-skills-guide
runtimes:
  - codex
  - claude
  - generic
entrypoints:
  skill_md: SKILL.md
  readme: README.md
  tests: tests/test-prompts.md
  scripts_dir: scripts
  examples_dir: examples
dependencies:
  tools:
    - trivy
    - osv-scanner
operational:
  use_when: Use when manifests and lockfiles need vulnerability, provenance, and package risk review before trust is granted.
  execution_mode: may-run-local-verification
  outputs:
    - Dependency findings
    - Risk ranking
    - Mitigation recommendations
  approval_boundary: May run local scanners and review package risk; require human approval before removing dependencies or changing production lockfiles.
verification:
  tests_min_prompts: 5
  deterministic_scripts: false
  security_reviewed: false
deprecated: false
